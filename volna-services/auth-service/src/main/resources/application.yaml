server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
        password: ${SPRING_DATASOURCE_PASSWORD}
jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
   secret: ${JWT_SECRET}
    expiration-ms: 3600000
